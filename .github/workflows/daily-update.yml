# 每天在 GitHub 雲端自動更新資料並推回（線上網站隨即重建）
# 不需要你的電腦開機；公開倉庫的 Actions 免費。
name: Daily data update

on:
  schedule:
    - cron: "17 9 * * *"     # 每天 09:17 UTC（台灣時間約 17:17）執行
  workflow_dispatch:          # 也可在 GitHub 網頁手動按一下執行

permissions:
  contents: write             # 允許把更新後的 docs/ 推回倉庫

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements-ci.txt

      - name: 重抓資料、重算預測、更新 docs/
        run: python daily_update.py

      # Supabase 免費專案閒置約一週就會自動暫停，暫停後登入與預測紀錄全部失效。
      # 每天戳一下 REST API 就算「有活動」，可避免被暫停。
      # 用的是 docs/supabase-config.js 裡的 anon 金鑰——它本來就是設計成公開的，
      # 真正的防線是資料庫的 Row Level Security，所以不需要存成 secret。
      # 加 || true 是因為：專案若已被暫停，這裡一定失敗，但不該讓整個每日更新跟著失敗。
      - name: 喚醒 Supabase（避免閒置被暫停）
        if: always()
        run: |
          URL=$(grep -oP 'SUPABASE_URL = "\K[^"]+' docs/supabase-config.js || true)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY = "\K[^"]+' docs/supabase-config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "未設定 Supabase 金鑰，略過。"; exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/profiles?select=user_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true)
          echo "Supabase 回應 HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ 專案是醒著的"
          else
            echo "⚠️ 專案可能已被暫停，需到 Supabase 後台按 Restore project 手動恢復"
          fi

      - name: 有變動就 commit 並 push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ outputs/ || true
          if git diff --cached --quiet; then
            echo "沒有變動，略過。"
          else
            git commit -m "每日自動更新資料 ($(date -u +%Y-%m-%d))"
            git push
          fi
